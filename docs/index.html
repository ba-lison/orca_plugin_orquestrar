<!doctype html>
<html lang="pt-BR" data-densidade="conforto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orquestrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Sofia+Sans+Condensed:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BALISON · Design System · tokens.css
   Fonte das regras: DESIGN.md (mesma pasta). Direção "Mão e máquina".
   O traço (grafismo) é gerado por traco.js, na mesma pasta.
   Camadas: 1) primitivos (valores)  2) semânticos (função)  3) componentes.
   Use sempre os semânticos no código. Primitivo direto só dentro deste arquivo.
   Tema:      <html data-tema="claro|escuro">   (sem atributo: segue o sistema)
   Densidade: <html data-densidade="conforto|padrao|compacta|plugin">
   ===================================================================== */

/* ---------- Fontes (caminho relativo a esta pasta) ---------- */

:root {
  /* ============ 1. PRIMITIVOS ============ */
  /* Marca (guia) */
  --p-branco: #F5F5F5;
  --p-preto: #131721;
  --p-caneta: #2347B0;
  --p-caneta-escuro: #16295C;
  --p-caneta-fundo: #101F48;    /* pressionado */
  --p-branco-puro: #FFFFFF;    /* só quando o meio não aceita o branco da marca */


  --p-neutro-050: #ECEDEF;
  --p-neutro-100: #E1E3E7;
  --p-neutro-200: #D1D4DB;
  --p-neutro-300: #B9BEC7;
  --p-neutro-400: #999FAB;
  --p-neutro-500: #757C89;
  --p-neutro-600: #5F6775;
  --p-neutro-700: #474F5D;
  --p-neutro-800: #303642;
  --p-neutro-900: #131721;
  --p-escuro-1: #1D222E;       /* superfícies no tema escuro */
  --p-escuro-2: #282D39;

  /* Estados: só em interface (mensagem, validação, status). Nunca em marketing. */
  --p-erro: #A12F2A;        --p-erro-claro: #F0897F;
  --p-aviso: #80520A;       --p-aviso-claro: #E3B04B;
  --p-sucesso: #2C6A36;     --p-sucesso-claro: #8CC793;

  /* ============ Tipografia ============ */
  /* Newsreader fala (títulos e citação), Inria Sans explica (texto e interface),
     Plex Mono só em código e prompt. Todas as entrelinhas em múltiplos de 4. */
  --fonte-display: "Newsreader", Georgia, "Times New Roman", serif;
  --fonte-detalhe: "Sofia Sans Condensed", sans-serif;
  --fonte-texto: "Inria Sans", "Segoe UI", system-ui, sans-serif;
  --fonte-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --peso-texto: 400;  --peso-medio: 500;  --peso-forte: 600;

  --tipo-display: 400 clamp(2.75rem, 6.4vw, 5.5rem)/1.04 var(--fonte-display);   /* 44 → 88 */
  --tipo-t1: 400 3rem/3.5rem var(--fonte-display);                               /* 48/56 */
  --tipo-t2: 400 2rem/2.5rem var(--fonte-display);                               /* 32/40 */
  --tipo-t3: 400 1.5rem/2rem var(--fonte-display);                               /* 24/32 */
  --tipo-citacao: italic 400 1.5rem/2rem var(--fonte-display);                   /* 24/32 */
  --tipo-titulo-comp: 500 1rem/1.5rem var(--fonte-texto);                        /* 16/24: card, modal */
  --tipo-texto: 400 1.0625rem/1.75rem var(--fonte-texto);                        /* 17/28 */
  --tipo-texto-ui: 400 0.875rem/1.25rem var(--fonte-texto);                      /* 14/20 */
  --tipo-legenda: 400 0.8125rem/1.25rem var(--fonte-detalhe);                      /* 13/20 */
  --tipo-rotulo: 500 0.8125rem/1.25rem var(--fonte-detalhe);                       /* 13/20, frase normal, sem maiúsculas */
  --tipo-numero: 400 3rem/1 var(--fonte-detalhe);                                /* número de destaque */
  --tipo-codigo: 400 0.875rem/1.5rem var(--fonte-mono);                          /* 14/24 */
  --tracking-display: -0.025em; --tracking-t: -0.015em; --tracking-t3: -0.01em; --tracking-rotulo: 0.01em;
  --medida: 62ch;

  /* ============ Espaço (8 px na estrutura, 4 px no ajuste fino) ============ */
  --esp-0: 0; --esp-1: 2px; --esp-2: 4px; --esp-3: 8px; --esp-4: 12px; --esp-5: 16px;
  --esp-6: 24px; --esp-7: 32px; --esp-8: 40px; --esp-9: 48px; --esp-10: 64px;
  --esp-11: 80px; --esp-12: 120px; --esp-13: 160px;
  --gutter: clamp(16px, 4vw, 48px);
  --container: 1200px;
  --secao: clamp(96px, 12vw, 192px);      /* respiro entre seções no marketing (v2: o dobro da v1) */
  --hero: clamp(120px, 16vw, 240px);
  --container-texto: 720px;               /* coluna de leitura no marketing */

  /* ============ Forma ============ */
  --raio: 0;                 /* tudo reto. Exceções abaixo. */
  --raio-redondo: 9999px;    /* só avatar, radio, ponto e marcador numerado */
  --linha-w: 1px;
  --foco-w: 2px; --foco-offset: 2px;

  /* ============ Movimento ============ */
  --dur-rapida: 120ms;       /* hover, troca de cor */
  --dur-base: 200ms;         /* abrir menu, tooltip, toggle */
  --dur-lenta: 320ms;        /* modal, painel lateral */
  --dur-traco: 900ms;        /* linha simples que se desenha (ícone, ✓, sublinhado) */
  --dur-traco-maquina: 760ms; /* cada linha precisa do traco.js */
  --traco-mao-final: .3;     /* opacidade da mão quando a máquina termina: fica visível */
  --dur-check: 240ms;        /* ✓ que se desenha em checkbox e confirmação */
  --dur-confirmacao: 1600ms; /* quanto tempo o botão fica em "Copiado/Salvo" */
  --ease-padrao: cubic-bezier(.2, 0, 0, 1);
  --ease-saida: cubic-bezier(.16, 1, .3, 1);
  --ease-traco: cubic-bezier(.65, 0, .35, 1);   /* a máquina */
  --ease-mao: cubic-bezier(.3, .1, .3, 1);      /* a mão: começa firme, solta no fim */

  /* ============ Camadas ============ */
  --z-fixo: 10; --z-menu: 20; --z-sobreposicao: 30; --z-modal: 40; --z-toast: 50; --z-tooltip: 60;

}

/* ============ Densidade padrao (app web). Vale na raiz e em qualquer contêiner. ============ */
:root, [data-densidade="padrao"] {
  --controle-h: 40px;  --controle-px: 16px;  --controle-gap: 8px;
  --celula-py: 12px;   --celula-px: 16px;
  --card-p: 24px;      --icone: 20px;
  --tipo-controle: var(--tipo-texto-ui);
}

/* ============ 2. SEMÂNTICOS · tema claro (raiz e qualquer contêiner com data-tema="claro") ============ */
:root, [data-tema="claro"] {
  color-scheme: light;
  --fundo: var(--p-branco);
  --superficie: #FFFFFF;               /* card sobre o fundo (guia) */
  --superficie-2: var(--p-neutro-050); /* hover de linha, faixa de tabela */
  --superficie-inversa: var(--p-preto);
  --texto: var(--p-preto);
  --texto-2: #525A68;
  --texto-3: var(--p-neutro-600);
  --texto-inverso: var(--p-branco);
  --linha: rgba(22, 22, 22, .16);      /* divisória, borda de card */
  --linha-forte: rgba(22, 22, 22, .38);/* moldura, cabeçalho de tabela */
  --borda-campo: var(--p-neutro-500);  /* campo e controle: 3:1 exigido */


  --acao: var(--p-caneta);              /* botão primário. Um por tela. */
  --acao-texto: var(--p-branco);
  --acao-hover: var(--p-caneta-escuro);
  --acao-ativa: var(--p-caneta-fundo);
  --link: var(--p-caneta);
  --link-visitado: var(--p-neutro-700);
  --destaque: var(--p-caneta);          /* número de destaque, ponto */
  --foco: var(--p-caneta);
  --selecao: rgba(15, 61, 58, .12);

  --erro: var(--p-erro);       --erro-fundo: #EBDCDC;    --erro-texto-acao: var(--p-branco);
  --sucesso-texto-acao: var(--p-branco);
  --aviso: var(--p-aviso);     --aviso-fundo: #E8DFD9;
  --sucesso: var(--p-sucesso); --sucesso-fundo: #E1E1DD;
  --info: var(--p-preto);      --info-fundo: var(--p-neutro-050);

  --sombra-sobreposta: 0 8px 24px rgba(22, 22, 22, .14);  /* só menu, popover, modal, toast */
  --veu: rgba(22, 22, 22, .56);                           /* fundo atrás do modal */


  --dado-1: var(--p-caneta); --dado-2: var(--p-preto); --dado-3: var(--p-neutro-500); --dado-4: var(--p-neutro-300);
  --dado-eixo: var(--linha-forte); --dado-grade: var(--linha);
}


@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    color-scheme: dark;
    --fundo: var(--p-preto); --superficie: var(--p-escuro-1); --superficie-2: var(--p-escuro-2);
    --superficie-inversa: var(--p-branco);
    --texto: var(--p-branco); --texto-2: var(--p-neutro-400); --texto-3: var(--p-neutro-400); --texto-inverso: var(--p-preto);
    --linha: rgba(241, 235, 235, .16); --linha-forte: rgba(241, 235, 235, .38); --borda-campo: var(--p-neutro-500);

    --acao: var(--p-branco); --acao-texto: var(--p-preto); --acao-hover: var(--p-neutro-200); --acao-ativa: var(--p-neutro-300);
    --link: #90A7E9; --link-visitado: var(--p-neutro-300); --destaque: #90A7E9; --foco: var(--p-branco);
    --selecao: rgba(241, 235, 235, .12);
    --erro: var(--p-erro-claro); --erro-fundo: #302423; --erro-texto-acao: var(--p-preto); --sucesso-texto-acao: var(--p-preto);
    --aviso: var(--p-aviso-claro); --aviso-fundo: #2F281C;
    --sucesso: var(--p-sucesso-claro); --sucesso-fundo: #242B25;
    --info: var(--p-branco); --info-fundo: var(--p-escuro-2);
    --sombra-sobreposta: 0 8px 24px rgba(0, 0, 0, .5); --veu: rgba(0, 0, 0, .64);
    --dado-1: var(--p-branco); --dado-2: var(--p-neutro-400); --dado-3: var(--p-neutro-600); --dado-4: var(--p-neutro-800);
  }
}
[data-tema="escuro"] {
  color-scheme: dark;
  --fundo: var(--p-preto); --superficie: var(--p-escuro-1); --superficie-2: var(--p-escuro-2);
  --superficie-inversa: var(--p-branco);
  --texto: var(--p-branco); --texto-2: var(--p-neutro-400); --texto-3: var(--p-neutro-400); --texto-inverso: var(--p-preto);
  --linha: rgba(241, 235, 235, .16); --linha-forte: rgba(241, 235, 235, .38); --borda-campo: var(--p-neutro-500);

  --acao: var(--p-branco); --acao-texto: var(--p-preto); --acao-hover: var(--p-neutro-200); --acao-ativa: var(--p-neutro-300);
  --link: #90A7E9; --link-visitado: var(--p-neutro-300); --destaque: #90A7E9; --foco: var(--p-branco);
  --selecao: rgba(241, 235, 235, .12);
  --erro: var(--p-erro-claro); --erro-fundo: #302423; --erro-texto-acao: var(--p-preto); --sucesso-texto-acao: var(--p-preto);
  --aviso: var(--p-aviso-claro); --aviso-fundo: #2F281C;
  --sucesso: var(--p-sucesso-claro); --sucesso-fundo: #242B25;
  --info: var(--p-branco); --info-fundo: var(--p-escuro-2);
  --sombra-sobreposta: 0 8px 24px rgba(0, 0, 0, .5); --veu: rgba(0, 0, 0, .64);
  --dado-1: var(--p-branco); --dado-2: var(--p-neutro-400); --dado-3: var(--p-neutro-600); --dado-4: var(--p-neutro-800);
}

/* ---------- Densidades ---------- */
[data-densidade="conforto"] { /* site, landing, toque */
  --controle-h: 48px; --controle-px: 24px; --controle-gap: 8px;
  --celula-py: 16px; --celula-px: 16px; --card-p: 32px; --icone: 24px; --tipo-controle: var(--tipo-texto);
}
[data-densidade="compacta"] { /* tabelas e painéis densos */
  --controle-h: 32px; --controle-px: 12px; --controle-gap: 8px;
  --celula-py: 8px; --celula-px: 12px; --card-p: 16px; --icone: 16px; --tipo-controle: var(--tipo-texto-ui);
}
[data-densidade="plugin"] { /* janelas dentro do Revit/AutoCAD */
  --controle-h: 28px; --controle-px: 8px; --controle-gap: 4px;
  --celula-py: 4px; --celula-px: 8px; --card-p: 12px; --icone: 16px;
  --tipo-controle: 400 0.8125rem/1.25rem var(--fonte-texto); /* 13/20 */
}

/* ---------- Utilitários de marca ---------- */
/* Desenho "Mão e máquina": <svg class="traco"> + traco.js. A cor é a do texto; --traco troca, se preciso. */
svg.traco { display: block; width: 100%; height: auto; color: var(--traco, var(--texto)); overflow: visible; }
svg.traco .traco-ponto { fill: var(--destaque); }
svg.traco .traco-mao, svg.traco .traco-mao-fixa { color: var(--tinta-mao, currentColor); }
svg.traco .traco-maquina { color: var(--tinta-maquina, currentColor); }
/* Linha simples que se desenha (sublinhado, ✓, divisória de abertura). */
.linha-desenha path, .linha-desenha line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: desenhar var(--dur-traco) var(--ease-traco) forwards; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes desenhar { to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  /* Tira o movimento, mantém cor e opacidade (ajudam a entender o que mudou). */
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; scroll-behavior: auto !important; }
  *:active, *:hover > .ico { transform: none !important; }
  .linha-desenha path, .linha-desenha line { stroke-dashoffset: 0; }
}

svg.traco { --tinta-mao: var(--destaque); --tinta-maquina: var(--texto); }

/* Acabamento por peça. As três amostras comparativas preservam seus próprios modos. */
[data-acabamento="humano"] svg.traco:not(.modo-svg) .traco-maquina { display:none; }
[data-acabamento="humano"] svg.traco:not(.modo-svg) .traco-mao { opacity:1 !important; }
[data-acabamento="preciso"] svg.traco:not(.modo-svg) .traco-mao { display:none; }
[data-acabamento] :is(.tag,.alerta) { position:relative; }
[data-acabamento] .alerta--erro { --tinta-contorno:var(--erro); }
[data-acabamento] .alerta--sucesso { --tinta-contorno:var(--sucesso); }
[data-acabamento] .alerta--aviso { --tinta-contorno:var(--aviso); }
[data-acabamento] .alerta--info { --tinta-contorno:var(--info); }
:is([data-acabamento="humano"],[data-acabamento="misto"]) :is(.tag,.alerta) { border-color:transparent; }
:is([data-acabamento="humano"],[data-acabamento="misto"]) :is(.tag,.alerta)::before {
  content:""; position:absolute; inset:-1px; pointer-events:none;
  background:var(--tinta-contorno,currentColor);
  mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%2032%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.3%22%20vector-effect%3D%22non-scaling-stroke%22%20stroke-linecap%3D%22round%22%20d%3D%22M1%203%20Q40%201.5%2098.5%202.2%20M97.6%201%20Q98.1%2013%2097.4%2030.5%20M99%2029.4%20Q51%2028.4%201%2030%20M2.3%2031%20Q1.6%2017%202.8%201%22%2F%3E%3C%2Fsvg%3E") center / 100% 100% no-repeat;
}
[data-acabamento="misto"] .tag { box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 24%,transparent); }


* { box-sizing: border-box; }
html { background: var(--fundo); }
body { margin: 0; background: var(--fundo); color: var(--texto); font: var(--tipo-texto); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
h1, h2 { font-family: var(--fonte-display); }
p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: var(--foco-w) solid var(--foco); outline-offset: var(--foco-offset); }
code { font-family: var(--fonte-mono); font-size: .84em; background: var(--superficie-2); padding: .1em .35em; overflow-wrap: anywhere; }
.wrap { max-width: var(--container); margin: 0 auto; padding-inline: var(--gutter); }
.rotulo { font: var(--tipo-rotulo); letter-spacing: var(--tracking-rotulo); color: var(--texto-2); }
.legenda { font: var(--tipo-legenda); color: var(--texto-2); }
.so-escuro { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .so-claro { display: none; } :root:not([data-tema="claro"]) .so-escuro { display: block; } }
[data-tema="escuro"] .so-claro { display: none; } [data-tema="escuro"] .so-escuro { display: block; }

/* topo */
.topo { border-bottom: 1px solid var(--linha); }
.topo .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 16px; }
.topo svg { width: 160px; height: auto; display: block; }
.seg { display: inline-flex; border: 1px solid var(--borda-campo); }
.seg button { font: 500 14px/1 var(--fonte-texto); background: transparent; color: var(--texto-2); border: 0; padding: 0 14px; min-height: 40px; min-width: 44px; cursor: pointer; transition: background-color var(--dur-base) var(--ease-padrao), color var(--dur-base) var(--ease-padrao), transform var(--dur-rapida) var(--ease-padrao); }
.seg button + button { border-left: 1px solid var(--linha); }
.seg button:active { transform: scale(.97); }
.seg button[aria-pressed="true"] { background: var(--texto); color: var(--fundo); }
@media (hover: hover) and (pointer: fine) { .seg button[aria-pressed="false"]:hover { color: var(--texto); background: var(--superficie-2); } }

/* abertura */
.abertura { padding-block: var(--esp-12) var(--esp-10); }
.abertura h1 { font: var(--tipo-display); font-size: clamp(2.5rem, 5.2vw, 4.5rem); letter-spacing: var(--tracking-display); margin-top: var(--esp-5); max-width: 18ch; }
.lead { font: 400 1.3125rem/2rem var(--fonte-texto); color: var(--texto-2); max-width: 40ch; margin-top: var(--esp-6); }
.feito { margin-top: var(--esp-5); color: var(--texto-2); max-width: 52ch; }
.figura-abertura { margin-top: var(--esp-10); }

/* seções */
section.bloco { padding-block: var(--secao) 0; }
section.bloco:last-of-type { padding-bottom: var(--secao); }
.cab { max-width: var(--container-texto); }
.cab h2 { font: var(--tipo-t1); letter-spacing: var(--tracking-t); margin-top: var(--esp-4); }
.cab p { margin-top: var(--esp-5); color: var(--texto-2); max-width: var(--medida); }
@media (max-width: 768px) { .cab h2 { font: var(--tipo-t2); } }
.corpo { margin-top: var(--esp-9); }

/* papéis */
.papeis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--linha-forte); }
.papel { padding: var(--esp-6) var(--esp-6) 0 0; }
.papel + .papel { padding-left: var(--esp-6); border-left: 1px solid var(--linha); }
.papel h3 { font: var(--tipo-t3); font-family: var(--fonte-display); letter-spacing: var(--tracking-t3); margin-top: var(--esp-3); }
.papel p { margin-top: var(--esp-4); color: var(--texto-2); }
@media (max-width: 1024px) { .papeis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .papel:nth-child(3) { padding-left: 0; border-left: 0; } .papel:nth-child(n+3) { margin-top: var(--esp-7); } }
@media (max-width: 560px) { .papeis { grid-template-columns: minmax(0, 1fr); } .papel, .papel + .papel { padding-left: 0; border-left: 0; } .papel + .papel { margin-top: var(--esp-7); } }

/* passos */
.passos { counter-reset: p; max-width: var(--container-texto); margin-top: var(--esp-9); }
.passos li { counter-increment: p; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: var(--esp-5); padding-block: var(--esp-5); border-top: 1px solid var(--linha); }
.passos li::before { content: counter(p); font: var(--tipo-rotulo); font-size: 1.0625rem; color: var(--texto-2); padding-top: 2px; font-variant-numeric: tabular-nums; }
.passos strong { font-weight: 700; }

/* regras */
.regras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--esp-9); max-width: 960px; }
.regras li { padding-block: var(--esp-5); border-top: 1px solid var(--linha); }
.regras h3 { font: var(--tipo-titulo-comp); font-weight: 700; }
.regras p { margin-top: var(--esp-2); color: var(--texto-2); }
@media (max-width: 768px) { .regras { grid-template-columns: minmax(0, 1fr); } }

/* perguntas e tabela */
.perguntas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--esp-6); }
.perguntas li { border-top: 1px solid var(--linha-forte); padding-top: var(--esp-5); }
.perguntas .n { font: var(--tipo-numero); color: var(--texto-2); font-variant-numeric: tabular-nums; }
.perguntas h3 { font: var(--tipo-titulo-comp); font-weight: 700; margin-top: var(--esp-4); }
.perguntas p { margin-top: var(--esp-2); color: var(--texto-2); }
@media (max-width: 1024px) { .perguntas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .perguntas { grid-template-columns: minmax(0, 1fr); } }
.tabela { margin-top: var(--esp-10); overflow-x: auto; max-width: 960px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: var(--celula-py) var(--celula-px) var(--celula-py) 0; border-bottom: 1px solid var(--linha); vertical-align: top; }
th { font: var(--tipo-rotulo); letter-spacing: var(--tracking-rotulo); color: var(--texto-2); border-bottom-color: var(--linha-forte); }
td:nth-child(3) { font-family: var(--fonte-mono); font-size: .875rem; }
.tag { display: inline-block; font: 500 .8125rem/1.25rem var(--fonte-texto); border: 1px solid var(--linha-forte); padding: 2px 8px; white-space: nowrap; }
.tag.topo-faixa { border-color: var(--texto); }
.nota { margin-top: var(--esp-6); max-width: var(--container-texto); color: var(--texto-2); }

/* descoberta */
.descoberta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--esp-6); }
.fonte { background: var(--superficie); border: 1px solid var(--linha); padding: var(--card-p); }
.fonte h3 { font: var(--tipo-titulo-comp); font-weight: 700; margin-top: var(--esp-3); }
.fonte p { margin-top: var(--esp-3); color: var(--texto-2); }
.fonte code { display: inline-block; margin-top: var(--esp-4); }
@media (max-width: 900px) { .descoberta { grid-template-columns: minmax(0, 1fr); } }
.citacao { font: var(--tipo-citacao); max-width: 34ch; margin-top: var(--esp-9); }

/* seu sim */
.sim { max-width: var(--container-texto); }
.sim li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--esp-4); padding-block: var(--esp-4); border-top: 1px solid var(--linha); }
.sim svg { width: 20px; height: 20px; margin-top: 4px; }

/* uso */
.codigo { background: #131721; color: #F5F5F5; border: 1px solid var(--linha); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 16px 16px 24px; max-width: var(--container-texto); }
.codigo code { background: none; padding: 0; font: var(--tipo-codigo); font-size: 1rem; color: inherit; }
.copiar { font: 500 14px/1 var(--fonte-texto); color: #F5F5F5; background: transparent; border: 1px solid rgba(245,245,245,.5); min-height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: transform var(--dur-rapida) var(--ease-padrao), background-color var(--dur-base), color var(--dur-base), border-color var(--dur-base); }
.copiar svg { width: 16px; height: 16px; }
.copiar:active { transform: scale(.97); }
.copiar.ok { background: #8CC793; color: #131721; border-color: #8CC793; }
@media (hover: hover) and (pointer: fine) { .copiar:not(.ok):hover { border-color: #F5F5F5; } }
.uso { margin-top: var(--esp-7); max-width: var(--container-texto); }
.uso li { padding-block: var(--esp-4); border-top: 1px solid var(--linha); }

/* rodapé */
footer { border-top: 1px solid var(--linha); }
footer .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-block: var(--esp-7); }
footer svg { width: 160px; height: auto; display: block; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.traco text { font: 400 15px var(--fonte-detalhe); fill: var(--texto-2); }

/* diagrama do caminho */
.fluxo { overflow-x: auto; }
.fluxo svg { display: block; width: 100%; min-width: 680px; height: auto; }
.fluxo path { fill: none; stroke: var(--texto); stroke-linecap: round; }
.f-main { stroke-width: 4; }
.f-ramo { stroke-width: 2; }
.f-leitura { stroke-dasharray: 6 6; }
.f-fecha { stroke-width: 2; }
.f-no { fill: var(--fundo); stroke: var(--texto); stroke-width: 2; }
.f-junta { fill: var(--texto); }
.f-fim { fill: var(--destaque); }
.fluxo text { font: 400 16px var(--fonte-detalhe); fill: var(--texto-2); }
.fluxo text.f-forte { font-weight: 500; fill: var(--texto); }

/* versão que convence */
.acoes { margin-top: var(--esp-8); }
.botao { display: inline-flex; align-items: center; min-height: var(--controle-h); padding: 0 var(--controle-px); background: var(--acao); color: var(--acao-texto); font: 500 1rem/1 var(--fonte-texto); text-decoration: none; outline: 1px solid transparent; outline-offset: 0; transition: background-color var(--dur-rapida) var(--ease-padrao), outline-offset var(--dur-base) var(--ease-padrao), outline-color var(--dur-base), transform var(--dur-rapida) var(--ease-padrao); }
.botao:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .botao:hover { background: var(--acao-hover); outline-color: var(--acao); outline-offset: 3px; } }
.problemas { max-width: var(--container-texto); }
.problemas li { padding-block: var(--esp-5); border-top: 1px solid var(--linha); font: 400 1.25rem/2rem var(--fonte-texto); }
.ganhos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--esp-9); }
.ganho { border-top: 1px solid var(--linha-forte); padding-top: var(--esp-6); }
.ganho h3 { font: var(--tipo-t3); font-family: var(--fonte-display); letter-spacing: var(--tracking-t3); }
.ganho p { margin-top: var(--esp-4); color: var(--texto-2); }
@media (max-width: 900px) { .ganhos { grid-template-columns: minmax(0, 1fr); gap: var(--esp-8); } }
details summary { cursor: pointer; font: 500 1rem/1.5rem var(--fonte-texto); padding-block: var(--esp-4); list-style: none; display: flex; justify-content: space-between; gap: 16px; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "+"; font-family: var(--fonte-detalhe); font-size: 1.25rem; color: var(--texto-2); }
details[open] summary::after { content: "–"; }
.ganho details { margin-top: var(--esp-5); border-top: 1px solid var(--linha); }
.ganho .tabela { margin-top: var(--esp-3); }
.ganho table { min-width: 0; }
.faq { max-width: var(--container-texto); }
.faq details { border-top: 1px solid var(--linha); }
.faq details:last-child { border-bottom: 1px solid var(--linha); }
.faq details p { padding-bottom: var(--esp-5); color: var(--texto-2); }
.pendente { border: 1px dashed var(--linha-forte); padding: var(--esp-5); color: var(--texto-2); max-width: var(--container-texto); font: var(--tipo-texto-ui); }
.fecho .uso { margin: 0 0 var(--esp-6); counter-reset: u; }
.fecho .uso li { counter-increment: u; display: grid; grid-template-columns: 32px minmax(0,1fr); }
.fecho .uso li::before { content: counter(u); font: var(--tipo-rotulo); color: var(--texto-2); padding-top: 4px; }
.fecho .pendente { margin-top: var(--esp-5); }
.convite { font: var(--tipo-citacao); margin-top: var(--esp-9); max-width: 34ch; }
</style>

  var html = document.documentElement, atual = "pt";

    var T = TEXTOS[l]; if (!T) return; atual = l;

    document.querySelectorAll(".seg [data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === l)); });
    try { localStorage.setItem("orquestrar-idioma", l); } catch (e) {}
  }
  var inicial = "pt";
  try { inicial = localStorage.getItem("orquestrar-idioma") || ""; } catch (e) { inicial = ""; }
  var q = new URLSearchParams(location.search);
  if (q.get("lang")) inicial = q.get("lang");
  if (q.get("tema")) html.setAttribute("data-tema", q.get("tema"));
  if (!TEXTOS[inicial]) { var n = (navigator.language || "pt").slice(0, 2); inicial = TEXTOS[n] ? n : "pt"; }
